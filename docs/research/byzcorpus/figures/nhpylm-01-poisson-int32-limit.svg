<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-label="Factorial overflow: 12! to 13!">
<title>Factorial overflow: 12! to 13!</title><desc>Exact factorial values vs signed int32 limit (2,147,483,647)</desc><rect x="0" y="0" width="1120" height="610" rx="0" fill="#ffffff"/><text x="46" y="52" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#20334a" text-anchor="start">Factorial overflow: 12! to 13!</text><text x="46" y="84" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52677b" text-anchor="start">Exact factorial values vs signed int32 limit (2,147,483,647)</text><line x1="46" y1="104" x2="1074" y2="104" stroke="#dbe5ee" stroke-width="2" /><text x="45" y="135" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#20334a" text-anchor="start">log10(k!) compared with the signed 32-bit maximum</text><line x1="786.5964932690591" y1="156" x2="786.5964932690591" y2="482" stroke="#ba4d4d" stroke-width="2" stroke-dasharray="7 6"/><text x="781.5964932690591" y="151" font-family="Arial, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ba4d4d" text-anchor="end">limit: 2³¹−1</text><text x="50" y="190" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="500" fill="#20334a" text-anchor="start">10!  = 3,628,800</text><rect x="320" y="170" width="327.9881516438397" height="37" rx="5" fill="#2563a6"/><text x="659.9881516438397" y="195" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#2563a6" text-anchor="start">within limit</text><line x1="320" y1="227" x2="1040" y2="227" stroke="#e8edf2" stroke-width="1" /><text x="50" y="268" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="500" fill="#20334a" text-anchor="start">12!  = 479,001,600</text><rect x="320" y="248" width="434.0168482041322" height="37" rx="5" fill="#00867b"/><text x="766.0168482041322" y="273" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#00867b" text-anchor="start">within limit</text><line x1="320" y1="305" x2="1040" y2="305" stroke="#e8edf2" stroke-width="1" /><text x="50" y="346" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="500" fill="#20334a" text-anchor="start">13!  = 6,227,020,800</text><rect x="320" y="326" width="489.714015819474" height="37" rx="5" fill="#ba4d4d"/><text x="821.7140158194741" y="351" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#ba4d4d" text-anchor="start">overflow</text><line x1="320" y1="383" x2="1040" y2="383" stroke="#e8edf2" stroke-width="1" /><text x="50" y="424" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="500" fill="#20334a" text-anchor="start">15!  = 1.3077 × 10¹²</text><rect x="320" y="404" width="605.82498055617" height="37" rx="5" fill="#ba4d4d"/><text x="937.82498055617" y="429" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#ba4d4d" text-anchor="start">overflow</text><line x1="320" y1="461" x2="1040" y2="461" stroke="#e8edf2" stroke-width="1" /><text x="52" y="536" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#20334a" text-anchor="start">32-bit factorial arithmetic first overflows at k = 13.</text><text x="52" y="565" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52677b" text-anchor="start">lgamma(k + 1) enables reliable scoring for Lmax = 20 and 30.</text></svg>
