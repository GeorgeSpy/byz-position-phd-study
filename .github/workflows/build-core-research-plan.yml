name: Compile core research plan PDF

on:
  push:
    branches:
      - docs/core-research-plan-final-music-example-znamenny-20261030
    paths:
      - documents/core-research-plan.tex
      - docs/assets/formula-variation.png
      - .github/workflows/build-core-research-plan.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Compile Greek proposal with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: documents/core-research-plan.tex
          latexmk_use_xelatex: true
          os: debian
          extra_system_packages: "fonts-freefont-otf fonts-liberation"
      - name: Verify and commit PDF
        shell: bash
        run: |
          test -s documents/core-research-plan.pdf
          pdfinfo documents/core-research-plan.pdf | grep Pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documents/core-research-plan.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: compile current core research plan PDF"
            git push
          fi
